[project]
name = "steam-rec"
version = "0.1.0"
description = "Batch-first Steam game recommendation MVP (Kaggle -> SILO lake -> Spark ALS / TF-IDF)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pyspark==4.0.5",
  "boto3>=1.40",
  "kagglehub>=0.3",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "typer>=0.15",
  "numpy>=2.1",
  "scipy>=1.14",
  "pyarrow>=18",
  "pandas>=2.2",
  "matplotlib>=3.9",
]

[project.scripts]
steam-rec = "steam_rec.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_rec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs SILO running / Spark"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py313"
